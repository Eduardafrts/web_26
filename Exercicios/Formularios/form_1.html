<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Email</title>
</head>
<body>

<h1>💙 Outlook.com</h1>
<hr>

<form action="" method="post">

<!-- NOME *************************************************************************************************-->
    <label>
        Nome:
        <input name="form_nome" type="text" placeholder="Digite seu nome" required>
    </label>

<!-- EMAIL *************************************************************************************************-->
    <label>
        Seu email:
        <input name="form_email" type="text" placeholder="Digite seu email" required>
    </label>

<br>
<br>
<hr>

<!-- DESTINATÁRIO ********************************************************************************************-->
    <label>
        Destinatário:
        <input name="form_dest" type="text" placeholder="Ex.:Joaozinho@outlook.com">
    </label>

<br>
<br>

<!-- ASSUNTO *************************************************************************************************-->
        <label>
        Assunto:
        <input name="form_ass" type="text" placeholder="Ex.:Currículo">
    </label>

<br>
<br>

<!-- MENSAGEM ***********************************************************************************************-->
     <label>
        Mensagem:<br>
        <textarea name="form_mensagem" rows="10" cols="50"></textarea>
    </label>

<br>
<br>

<!-- BOTÕES ************************************************************************************************-->
    <button type="submit">Enviar</button>
    <button type="reset">Limpar</button>


</form>
</body>
</html>
