<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Pesquisa</title>
</head>
<body>

<h1>🩷 Pesquisa de satisfação do cliente</h1>
<hr>

<form action="" method="post">

<!-- NOME ***************************************************************************************************-->
<label>
    Nome:
    <input name="form_nome" type="text" placeholder="Digite seu nome">
</label>

<br>
<br>

<!-- EMPRESA *************************************************************************************************-->
<label>
    Empresa:
    <input name="form_empresa" type="text" placeholder="Digite o nome da empresa">
</label>

<br>
<br>

<!-- IDADE **************************************************************************************************-->
<label>Selecione sua idade:</label>
<br>
<br>
    <label>
            <input name="form_idade" value="1" type="radio">
            10-20 anos
    </label>
    <label>
            <input name="form_idade" value="2" type="radio">
            20-30 anos
    </label>
    <label>
            <input name="form_idade" value="3" type="radio">
            30-50 anos
    </label>
    <label>
            <input name="form_idade" value="4" type="radio">
            50-80 anos
    </label>

<br>
<br>

<!-- EMAIL *************************************************************************************************-->
<label>
    E-mail:
    <input name="form_email" type="text" placeholder="Digite seu email">
</label>

<br>
<br>

<!-- TELEFONE E CELULAR **************************************************************************************-->
<label>
    Telefone comercial:
    <input name="form_tel" type="text" placeholder="Ex.:18-9907 2367">
</label>
<label>
    Celular:
    <input name="form_cell" type="text" placeholder="Ex.:18-9967 6700">
</label>

    <br>
<hr>

<!-- PERGUNTA 1 *********************************************************************************************-->
<label>Como você avalia nossos serviços atualmente?</label>
<br>
<br>
    <label>
            <input name="form_ava" value="1" type="radio">
            REGULAR
    </label>
    <label>
            <input name="form_ava" value="2" type="radio">
            BOM
    </label>
    <label>
            <input name="form_ava" value="3" type="radio">
            EXCELENTE
    </label>

<br>
<br>

<!-- PERGUNTA 2 ********************************************************************************************-->
<label>Como você avalia os serviços da operacional?</label>
<br>
<br>
    <label>
            <input name="form_avaop" value="1" type="radio">
            POUCO SATISFATÓRIO
    </label>
    <label>
            <input name="form_avaop" value="2" type="radio">
            SATISFATÓRIO
    </label>
    <label>
            <input name="form_avaop" value="3" type="radio">
            MUITO SATISFATÓRIO
    </label>

<br>
<br>


<!-- PERGUNTA 3 ********************************************************************************************-->
<label>Os profissionais lhe atendem de forma satisfatória?</label>
<br>
<br>
    <label>
            <input name="form_prof" value="1" type="radio">
            NÃO
    </label>
    <label>
            <input name="form_prof" value="2" type="radio">
            SIM
    </label>

<br>
<br>

<!-- PERGUNTA 4 ***********************************************************************************************-->
    <label>
        Você tem alguma sugestão ou crítica a fazer para cada vez mais melhorarmos nossos serviços?<br>
        <textarea name="form_mensagen" rows="10" cols="50"></textarea>
    </label>

<!-- BOTÕES **************************************************************************************************-->
<br>
    <button type="submit">Enviar</button>
    <button type="reset">Limpar</button>

</form>
</body>
</html>
