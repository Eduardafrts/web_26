<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Tags de Texto</title>
</head>
<body>
<!-- Hr serve para fazer linha divisora -->
<hr>
<!-- Tamanhos de Letra -->
<h1>Título 1</h1>
<h2>Título 2 </h2>
<h3>Título 3 </h3>
<h4>Título 4 </h4>
<h5>Título 5 </h5>
<h6>Título 6 </h6>
<hr>

<!--P para parágrafo-->
<p>Isso é um parágrafo</p>
<hr>
<!-- Br serve para quebrar a linha, não fecha -->
<!-- Ctrl/ para comentar -->
<p>
    Primeira linha<br>
    Segunda linha
</p>
<hr>

<!--LISTAS ENUMERADAS-->
<!--OL ordenada -->
<!-- UL não ordenada-->

<h2>Lista não ordenada</h2>
<ul>
    <li>Item 1</li>
    <li>Item 2</li>
    <li>Item 3</li>
</ul>
<hr>
<h2>Lista ordenada</h2>
<ol>
    <li>Item 1</li>
    <li>Item 2</li>
    <li>Item 3</li>
</ol>

<!--Links-->
<a href="https://www.google.com" title="Clique aqui para ir para o google">Google</a><br>
<a href="https://www.google.com" target="blank">Google - nova aba</a>
</body>
</html>
