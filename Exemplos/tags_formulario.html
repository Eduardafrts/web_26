<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/html">
<head>
    <meta charset="UTF-8">
    <title>Formulário</title>
</head>
<body>

<h1>Exemplos de formulários</h1>

<!-- O METODO DEVE SER POST. GET BUSCA, POST ENVIA ---------------------------------------------------------->
<form action="" method="get">

<!-- EXEMPLO 1 DE UM LABEL INPUT ----------------------------------------------------------------------------->
    <label>
        Nome:
<!-- O name deve começar com form_ -->
        <input name="form_nome" type="text" placeholder="Digite seu nome" required>
    </label>

<br>
<br>

<!-- EXEMPLO 2 DE LABEL INPUT ------------------------------------------------------------------------------->
    <label for="input2">Sobrenome:</label>
    <input id="input2" name="form_sobrenome" type="text" placeholder="Ex.:Silva">

<br>
<br>

<!-- EXEMPLO DE IDADE --------------------------------------------------------------------------------------->
      <label>
        Idade:
        <input name="form_idade" type="number" placeholder="Digite sua idade">
    </label>

<br>
<br>

<!-- EXEMPLO DE DATA ---------------------------------------------------------------------------------------->
    <label>
        Data de nascimento:
        <input name="form_data" type="date" placeholder="Digite sua data de nascimento">
    </label>

<br>
<br>

<!-- EXEMPLO DE SENHA ---------------------------------------------------------------------------------------->
    <label>
        Senha:
        <input name="form_senha" type="password" placeholder="Digite sua senha">
    </label>

<br>
<hr>
<br>

<!-- EXEMPLO DE ÚNICA ESCOLHA ---------------------------------------------------------------------------------->
    <label>Qual o ano atual do seu ensino médio?</label>

<br>
<br>

    <label>
            <input name="form_em" value="1" type="radio">
            1 EM
    </label>

<br>
<br>

    <label>
            <input name="form_em" value="2" type="radio">
            2 EM
    </label>

    <label>
            <input name="form_em" value="3" type="radio">
            3 EM
    </label>

<br>
<br>

<!-- CHECKBOX ------------------------------------------------------------------------------------------->
    <label>Qual a sua carteira de motorista?</label>

<br>
<br>

    <label> <input name="form_carro" type="checkbox">
        Carro
    </label>

    <label> <input name="form_moto" type="checkbox">
        Moto
    </label>

<br>

    <label> <input name="form_cami" type="checkbox">
        Caminhão
    </label>

<br>
<br>

<!-- TEXT AREA ---------------------------------------------------------------------------------------------->
    <label>
        Comentário:<br>
        <textarea name="form_comentario" rows="10" cols="25"></textarea>
    </label>

<br>
<br>

<!-- OPÇÕES ------------------------------------------------------------------------------------------------->
    <label>
        Cidade:
        <select name="form_cidade">
            <option value="guararapes">Guararapes</option>
            <option value="aracatuba">Araçatuba</option>
            <option value="valparaiso">Valparaiso</option>

        </select>
    </label>

<br>
<br>

<!-- BOTÃO --------------------------------------------------------------------------------------------------->
<!-- Sempre vai ser submit para salvar -->
    <button type="submit">Enviar</button>
    <button type="reset">Limpar</button>

</form>
</body>
</html>
